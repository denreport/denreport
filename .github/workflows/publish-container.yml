name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - run: docker build -t denreport-web:publish .
      - run: docker run -d --rm -p 8080:8080 --name denreport-web-publish denreport-web:publish
      - name: wait for /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          echo "denreport-web-publish failed to become healthy" >&2
          docker logs denreport-web-publish
          exit 1
      - run: curl -fsS http://localhost:8080/ | grep -q 'id="app"'
      - if: always()
        run: docker rm -f denreport-web-publish

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: tag and push edge
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag denreport-web:publish ghcr.io/denreport/denreport:edge
          docker push ghcr.io/denreport/denreport:edge

      - name: tag and push release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag denreport-web:publish "ghcr.io/denreport/denreport:${version}"
          docker tag denreport-web:publish ghcr.io/denreport/denreport:latest
          docker push "ghcr.io/denreport/denreport:${version}"
          docker push ghcr.io/denreport/denreport:latest

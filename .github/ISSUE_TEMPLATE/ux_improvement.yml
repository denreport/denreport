name: UX Improvement
description: Improve usability or feel of an existing feature
labels: ["enhancement", "ux"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What's inconvenient right now, and how
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      description: What would make it easier to use. Mention other tools' behavior for reference if relevant
    validations:
      required: true
  - type: textarea
    id: investigation
    attributes:
      label: Implementation hints (optional)
      description: Related files (path:line), suspected cause. Prefix guesses with "Guess:"
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / related issues (optional)

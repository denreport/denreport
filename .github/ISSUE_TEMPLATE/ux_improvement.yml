name: UX 改善
description: 既存機能の使い勝手・操作感の改善
labels: ["enhancement", "ux"]
body:
  - type: textarea
    id: current
    attributes:
      label: 現状の挙動
      description: いま何がどう不便か
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 望ましい挙動
      description: どうなれば使いやすいか。参考にする他ツールの挙動があれば書く
    validations:
      required: true
  - type: textarea
    id: investigation
    attributes:
      label: 実装の手がかり（任意）
      description: 関連ファイル（パス:行）・原因候補。推測には「推測:」と付ける
  - type: textarea
    id: dependencies
    attributes:
      label: 依存・関連 issue（任意）

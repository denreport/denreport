name: Bug Report
description: Report unexpected behavior or a defect
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happens, in 1-3 sentences
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, numbered steps
      placeholder: |
        1. Open the designer
        2. …
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: investigation
    attributes:
      label: Investigation notes (optional)
      description: Suspected cause, related files (path:line), confirmed facts. Prefix guesses with "Guess:"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Chrome 138 / commit abc1234"

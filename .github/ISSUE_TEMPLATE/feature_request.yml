name: Feature Request
description: Request a new feature or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What you can't do today, and why it matters. Include a use case if you have one
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: How it should behave. Include a UI sketch or operation flow if you have one
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope (optional)
      description: State explicitly what this issue will NOT do, to keep it from growing unbounded
  - type: textarea
    id: investigation
    attributes:
      label: Implementation hints (optional)
      description: Related files (path:line), touchpoints with existing code, candidate approaches. Prefix guesses with "Guess:"
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / related issues (optional)
      placeholder: "e.g. requires #12 first"

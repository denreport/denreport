name: 機能要望
description: 新しい機能・能力の追加要望
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 何ができなくて困るか。ユースケースがあれば書く
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能
      description: どう動いてほしいか。UI 案・操作フローがあれば書く
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: スコープ外（任意）
      description: この issue でやらないことを明示して肥大化を防ぐ
  - type: textarea
    id: investigation
    attributes:
      label: 実装の手がかり（任意）
      description: 関連ファイル（パス:行）・既存実装との接点・技術候補。推測には「推測:」と付ける
  - type: textarea
    id: dependencies
    attributes:
      label: 依存・関連 issue（任意）
      placeholder: "例: #12 が先に必要"
